<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم الطلبات</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="site-header">
    <div class="brand">🌿 لوحة تحكم الطلبات</div>
  </header>

  <!-- شاشة تسجيل الدخول -->
  <div class="login-box" id="loginBox">
    <h2>تسجيل الدخول</h2>
    <div class="field">
      <label for="loginEmail">البريد الإلكتروني</label>
      <input type="email" id="loginEmail" placeholder="admin@example.com">
    </div>
    <div class="field">
      <label for="loginPassword">كلمة المرور</label>
      <input type="password" id="loginPassword" placeholder="••••••••">
    </div>
    <button class="submit-btn" id="loginBtn">دخول</button>
    <div class="login-error" id="loginError">البريد أو كلمة المرور غير صحيحة</div>
  </div>

  <!-- لوحة الطلبات -->
  <div class="admin-wrap" id="dashboard" style="display:none;">
    <div class="admin-header">
      <h2>الطلبات الواردة</h2>
      <button class="logout-btn" id="logoutBtn">تسجيل الخروج</button>
    </div>

    <div class="orders-table-wrap">
      <table>
        <thead>
          <tr>
            <th>التاريخ</th>
            <th>الاسم</th>
            <th>الهاتف</th>
            <th>الولاية</th>
            <th>العنوان</th>
            <th>الطلبية</th>
            <th>الحالة</th>
            <th>إجراء</th>
          </tr>
        </thead>
        <tbody id="ordersBody"></tbody>
      </table>
    </div>
    <div class="empty-state" id="emptyState" style="display:none;">لا توجد طلبات بعد</div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="admin.js"></script>
</body>

</html>
